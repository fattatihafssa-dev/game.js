
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game - Empereur</title>

    <link rel="stylesheet" href="./dist/output.css">

    
</head>

<body class="text-white font-serif">

    <main class="mx-auto min-h-screen max-w-[1600px] px-5 py-8">

        <!-- HEADER -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold tracking-widest text-blue-400 md:text-6xl">
                DUEL DES CAMPS
            </h1>

            <p class="mt-2 text-2xl font-bold text-blue-500">
                Empereur <span class="text-blue-500">VS</span>Esclave
            </p>
        </header>


        <!-- PLAYER AND COMPUTER INFORMATION -->
        <section class="mb-10 grid grid-cols-1 gap-6 md:grid-cols-2">

            <!-- PLAYER -->
            <div class="gold-border rounded-2xl bg-black/70 p-6">
                <div class="flex items-center gap-5">
                    <div class="text-6xl">👑</div>

                    <div>
                        <h2 class="text-2xl font-bold">Joueur</h2>
                        <p id="player-camp" class="mt-2 text-lg text-gray-300">
                            Camp : Empereur
                        </p>
                        <p class="mt-2 text-2xl font-bold text-yellow-400">
                            Score : <span id="player-score">0</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- COMPUTER -->
            <div class="gold-border rounded-2xl bg-black/70 p-6">
                <div class="flex items-center justify-end gap-5">
                    <div class="text-right">
                        <h2 class="text-2xl font-bold">Ordinateur</h2>
                        <p id="computer-camp" class="mt-2 text-lg text-gray-300">
                            Camp : Esclave
                        </p>
                        <p class="mt-2 text-2xl font-bold text-blue-400">
                            Score : <span id="computer-score">0</span>
                        </p>
                    </div>

                    <div class="text-6xl">🛡️</div>
                </div>
            </div>

        </section>


        <!-- ROUND INFORMATION -->
        <section class="mb-10 text-center">
            <div class="gold-border mx-auto w-fit rounded-xl bg-black/80 px-10 py-4">
                <h2 class="text-2xl font-bold text-yellow-100">
                    Manche <span id="round-number">1</span> / 12
                </h2>
            </div>

            <p id="first-player" class="mt-4 text-lg text-blue-300">
                Premier joueur : Empereur
            </p>
        </section>


        <!-- GAME ARENA -->
        <section class="grid grid-cols-1 items-center gap-6 lg:grid-cols-[1fr_auto_1fr]">

            <!-- PLAYER HAND -->
            <div class="gold-border rounded-2xl bg-black/70 p-5">
                <h2 class="mb-6 text-center text-2xl font-bold text-blue-300">
                    Votre main
                </h2>

                <div id="player-hand"
                     class="flex flex-wrap justify-center gap-3">

                     <img scr="https://e-card-kaiji.netlify.app/static/media/citizen.095ee3dc.jpg"
                         alt = "empereur"
                         class = "h-full w-full object-contain">

                    <button type="button"
                            data-card="empereur"
                            class="game-card flex flex-col items-center justify-between p-3 text-center">
                            
                        <span class="mt-5 text-5xl">👑</span>
                        <span class="text-lg font-bold text-yellow-100">Empereur</span>
                    </button>

                    <button type="button"
                            data-card="citoyen"
                            class="game-card flex flex-col items-center justify-between p-3 text-center">
                        <span class="mt-5 text-5xl">🧑</span>
                        <span class="text-lg font-bold text-yellow-100">Citoyen</span>
                    </button>

                    <button type="button"
                            data-card="citoyen"
                            class="game-card flex flex-col items-center justify-between p-3 text-center">
                        <span class="mt-5 text-5xl">🧑</span>
                        <span class="text-lg font-bold text-yellow-100">Citoyen</span>
                    </button>

                    <button type="button"
                            data-card="citoyen"
                            class="game-card flex flex-col items-center justify-between p-3 text-center">
                        <span class="mt-5 text-5xl">🧑</span>
                        <span class="text-lg font-bold text-yellow-100">Citoyen</span>
                    </button>

                    <button type="button"
                            data-card="citoyen"
                            class="game-card flex flex-col items-center justify-between p-3 text-center">
                        <span class="mt-5 text-5xl">🧑</span>
                        <span class="text-lg font-bold text-yellow-100">Citoyen</span>
                    </button>

                </div>
            </div>


            <!-- VS -->
            <div class="py-4 text-center">
                <span class="text-6xl font-extrabold text-yellow-400 drop-shadow-lg">
                    VS
                </span>
            </div>


            <!-- COMPUTER HAND -->
            <div class="gold-border rounded-2xl bg-black/70 p-5">
                <h2 class="mb-6 text-center text-2xl font-bold text-yellow-100">
                    Main de l'ordinateur
                </h2>

                <div id="computer-hand"
                     class="flex flex-wrap justify-center gap-3">

                    <div class="game-card computer-card"></div>
                    <div class="game-card computer-card"></div>
                    <div class="game-card computer-card"></div>
                    <div class="game-card computer-card"></div>
                    <div class="game-card computer-card"></div>

                </div>
            </div>

        </section>


        <!-- GAME MESSAGE -->
        <section class="mt-8 text-center">
            <p id="game-message"
               class="inline-block rounded-full border-2 border-yellow-500 bg-black/80 px-10 py-3 text-xl font-bold text-yellow-300">
                Choisissez une carte pour jouer
            </p>
        </section>


        <!-- BOTTOM INFORMATION -->
        <section class="mt-10 flex flex-col items-center justify-between gap-6 md:flex-row">

            <!-- WINNER COUNTER -->
            <div class="gold-border flex items-center gap-5 rounded-full bg-black/80 px-10 py-5">
                <span class="text-4xl">🏆</span>

                <div class="text-center">
                    <p class="text-lg font-bold text-yellow-200">
                        Victoires du joueur
                    </p>

                    <p id="winner-count" class="text-3xl font-extrabold text-yellow-400">
                        0
                    </p>
                </div>
            </div>


            <!-- CAMP INDICATOR -->
            <div class="gold-border rounded-full bg-black/80 px-8 py-4 text-center">
                <p class="text-lg font-bold text-yellow-300">
                    Camp actuel : <span id="camp-indicator">Empereur</span>
                </p>
            </div>

        </section>

    </main>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
