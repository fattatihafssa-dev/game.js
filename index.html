
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empereur, Citoyen, Esclave</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="min-h-screen bg-black text-slate-300"
    style="font-family: 'Cormorant Garamond', serif;">

    <!-- Navigation -->
    <nav class="flex flex-wrap items-center justify-between gap-4 border-b border-yellow-600 bg-black px-8 py-5">

        <h2 class="text-xl font-bold text-yellow-400">
            ⚔ EMPEREUR
        </h2>

        <div class="flex flex-wrap gap-8">
            <a href="#home" class="text-white hover:text-yellow-400">Accueil</a>
            <a href="#Partie" class="text-white hover:text-yellow-400">Partie</a>
            <a href="#players" class="text-white hover:text-yellow-400">Joueurs</a>
            <a href="#Classement" class="text-white hover:text-yellow-400">Classement</a>
            <a href="#Profil" class="text-white hover:text-yellow-400">Profil</a>
        </div>

    </nav>

    <!-- Image -->
    <img
        src="https://t4.ftcdn.net/jpg/05/22/47/03/360_F_522470379_KJPDr4tkGN5RVNJAeE3PJZrvyPX0WFTv.jpg"
        alt="Emperor"
        class="h-full w-full object-contain"
    >

    <main class="mx-auto flex w-full max-w-6xl flex-col gap-4 px-6 py-8sm:flex-row lg:flex-row md:flex-row">

        <!-- Side menu -->
        <aside class="w-full shrink-0 rounded-2xl border border-blue-300 bg-black p-6 text-white md:w-64">

            <h2 class="mb-6 rounded-xl bg-yellow-400 px-4 py-2 font-bold text-black">
                Menu
            </h2>

            <div class="flex flex-col gap-6">
                <a href="#home" class="hover:text-yellow-400">
                    Information
                </a>

                <a href="#Profil" class="hover:text-yellow-400">
                    👤 Players profile
                </a>

                <a href="#Classement" class="hover:text-yellow-400">
                    Classement
                </a>

                <a href="#playing-rules" class="hover:text-yellow-400">
                    Playing rules
                </a>
            </div>

        </aside>


            <!-- Players -->
            <section id="players" class="mb-10">

                <h2 class="mb-6 rounded-lg border border-yellow-300 p-4 text-2xl font-bold text-white">
                    Profils des joueurs
                </h2>

                <form id="players-form" class="mb-8 rounded-xl border border-yellow-300 p-6 text-white">

                    <h3 class="mb-4 text-lg font-semibold">
                        Créer un nouveau profil
                    </h3>

                    <div class="mb-4 rounded-lg border border-yellow-300 p-4">

                        <label for="nickname" class="mb-2 block">
                            Pseudo
                        </label>

                        <input
                            type="text"
                            id="nickname"
                            placeholder="Entrez votre pseudo"
                            class="w-full rounded-lg bg-slate-800 p-3 text-white"
                        >

                    </div>

                    <div class="mb-4 rounded-lg border border-yellow-300 p-4">

                        <label for="avatar" class="mb-2 block">
                            Choisissez un avatar
                        </label>

                        <select
                            id="avatar"
                            class="w-full rounded-lg bg-slate-800 p-3 text-white"
                        >
                            <option value="empereur">Empereur</option>
                            <option value="citizen">Citoyen</option>
                            <option value="slave">Esclave</option>
                        </select>

                    </div>

                    <button
                        type="submit"
                        class="rounded-lg bg-yellow-400 px-6 py-3 font-bold text-black hover:bg-yellow-200"
                    >
                        Ajoutez un joueur
                    </button>

                </form>

                <div
                    id="players-list"
                    class="my-4 grid grid-cols-1 gap-4 border-t-2 border-amber-500 pt-4 sm:grid-cols-2 lg:grid-cols-3">
                </div>

                <!-- Three boxes -->
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">

                    <div class="min-h-40 rounded-lg border border-white p-12"></div>

                    <div class="min-h-40 rounded-lg border border-white p-12"></div>

                    <div class="min-h-40 rounded-lg border border-white p-12"></div>

                </div>

            </section>

            <!-- History -->
            <section id="history" class="mb-12 rounded-2xl bg-slate-800 p-2 border border-blue-300"">

                <h2 class="mb-6 text-2xl font-bold text-yellow-300">
                    Historique
                </h2>

                <div class="mb-6">

                    <label for="history-search" class="mb-2 block">
                        Recherche un joueur
                    </label>

                    <input
                        type="text"
                        id="history-search"
                        placeholder="Entrez un pseudo..."
                        class="w-full rounded-lg bg-slate-700 p-3 text-white focus:outline-none focus:ring-2 focus:ring-orange-400"
                    >

                </div>

                <label for="result-filter" class="mb-8 block ">
                    Filtrer par résultat
                </label>

            </section>

        </div>

    </main>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
