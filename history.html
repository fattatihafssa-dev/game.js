<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empereur, Citoyen, Esclave</title>


    <link rel="stylesheet" href="./dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>

<body class="min-h-screen bg-black text-slate-300"
    style="font-family: 'Cormorant Garamond', serif;">



<section id="history" class="w-full rounded-2xl border border-yellow-500 bg-slate-900 p-5"></section>
       

            <h2 class="mb-6 text-2xl font-bold text-yellow-300">
                Historique
            </h2>

            <div class="flex flex-cols gap-4">
                <div>

                <label for="history-search" class="mb-2 block">
                    Recherche un joueur
                </label>

                <input
                    type="text"
                    id="history-search"
                    placeholder="Entrez un pseudo..."
                    class="w-full rounded-lg bg-slate-700 p-3 text-white focus:outline-none focus:ring-2 focus:ring-orange-400"
                >

                <select id="result-filter" 
                class="mt-3 w-full rounded-lg bg-slate-800 p-2 text-white">
                    <option value="all">All results</option>
                    <option value="win">Wins</option>
                    <option value="Loss">losses</option>
                    <option value="Draw">Draws</option>
                </select>
                  </div>

                    <div>
                        <label for="date-filter" class="mb-2 block">
                            Filtrer par date
                        </label>
                <select id="date-filter" class="mt-3 w-full rounded-lg bg-slate-800 p-2 text-white">
                    <option value="all">All dates</option>
                    <option value="today">Today</option>
                    <option value="Week">Week</option>
                </select>

            </div>
            </div>

           <div id="history-list" class="flex flex-col gap-4" >
            <p class="text-centre text-slate-400">
                Auncun historique pour le moment
            </p>
           </div> 
              </section>

        </div>
